<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestión de citas médicas{% endblock %}</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; color: #203448; background: #f3f6fa; margin: 0; }
    main { max-width: 1000px; margin: 48px auto; padding: 32px; background: white; border-radius: 12px; }
    h1 { margin-top: 0; } a { color: #1764a0; } table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #dce4ed; } th { background: #edf3fa; }
    button, .button { display: inline-block; background: #17496e; color: white; padding: 10px 18px; border: 0; border-radius: 6px; cursor: pointer; text-decoration: none; font: inherit; }
    input, select { font: inherit; padding: 8px; border: 1px solid #aab9c8; border-radius: 4px; max-width: 100%; }
    label { display: block; font-weight: 600; } .errorlist { color: #a51d30; } .table-wrap { overflow-x: auto; }
    footer { color: #657687; margin-top: 32px; font-size: 13px; } .actions { white-space: nowrap; }
    @media(max-width: 650px) { main { margin: 16px; padding: 20px; } }
  </style>
</head>
<body><main>
  {% block content %}{% endblock %}
  <footer>Proyecto académico · Angel Gabriel Reyes Huayta</footer>
</main></body>
</html>
